<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order - Daraz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Track Your Order</h1>
    </header>

    <div class="box">

        <h2>Enter tracking no. to trace your order</h2>
        <div class="tracking-form">
        <input type="text" placeholder="Tracking number" required>



        <br>
<button onclick="window.location.href='track.html'">Track my package</button>  <br><br>
        <button onclick="window.location.href='index.html'">
            ← Back to Home
        </button>

    </div>

</body>
<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#f5f5f5;
        text-align: center;
    }

    header{
        background:#587b16;
        color:white;
        text-align:center;
        padding:20px;
    }

  
    h1{
        color:#ffffff;
        text-align:center;
    }

    h2{
        color:#000000;
    }

    .box{
        width:400px;
        margin:50px auto;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.15);
    }

    button{
        margin-top:20px;
        padding:10px 20px;
        background:#5b8429;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#2d340b;
    }
        input{
        width:100%;
        text-align: center;
        padding:10px;
        margin:8px 0 18px;
        border:1px solid #ccc;
        border-radius:5px;
        font-size:15px;
    }
</style>

</html>
