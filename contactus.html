<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactus - Daraz</title>

</head>
<body>
    
    <header>
        <h1>Contact Us</h1>
    </header>

    <div class="box">

        <h2>Get in touch with us</h2>
        <div class="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <br>
        
            <button onclick="window.location.href='submit.html'">Submit</button>  <br><br>
            <button onclick="window.location.href='index.html'">
                ← Back to Home
            </button>
        </div>

    </div>
    </body>
        <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f5f5f5;
            text-align: center;
        }

        header{
            background:#ff8c00;
            color:white;
            text-align:center;
            padding:20px;
        }

      
        h1{
            color:#ffffff;
            text-align:center;
        }

        h2{
            color:#000000;
        }

        .box{
            width:400px;
            margin:50px auto;
            background:white;
            padding:20px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);

        }
        .contact-form input, .contact-form textarea{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }
        button{
            margin-top:20px;
            padding:10px 20px;
            background:#f85606;
            color:white;
            border:#ff7300;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }
    </style>
</html>
