<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Daraz</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f5f5f5;
        }

        header{
            background:#f85606;
            color:white;
            text-align:center;
            padding:20px;
        }

        .container{
            width:400px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            color:#f85606;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0 18px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#f85606;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#d94d00;
        }

        p{
            text-align:center;
        }

        a{
            color:#f85606;
            text-decoration:none;
        }
    </style>
</head>

<body>

<header>
    <h1>Create Your Daraz Account</h1>
</header>

<div class="container">

    <h2>Sign Up</h2>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="03XX-XXXXXXX" required>

        <label>Password</label>
        <input type="password" placeholder="Create a password" required>

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm your password" required>

        <button type="submit">Sign Up</button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

    <p>
        <a href="index.html">← Back to Home</a>
    </p>

</div>

</body>
<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#f5f5f5;
    }

    header{
        background:#f85606;
        color:white;
        text-align:center;
        padding:20px;
    }

    .container{
        width:400px;
        margin:40px auto;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.15);
    }

    h2{
        text-align:center;
        color:#f85606;
    }

    label{
        font-weight:bold;
    }

    input{
        width:100%;
        padding:10px;
        margin:8px 0 18px;
        border:1px solid #ccc;
        border-radius:5px;
        font-size:15px;
    }

    button{
        width:100%;
        padding:12px;
        background:#f85606;
        color:white;
        border:none;
        border-radius:5px;
        font-size:16px;
        cursor:pointer;
    }

    button:hover{
        background:#d94d00;
    }
</style>
</html>
